<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбивание номеров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e; color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding: 20px 0; height: 100vh; overflow-y: auto;
        }
        .header { display: flex; justify-content: space-between; width: 90%; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .balance { color: #32d74b; }
        .plate-container {
            background: white; color: black; border-radius: 8px; border: 2px solid #333;
            width: 90%; max-width: 350px; height: 80px; display: flex; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; transition: 0.3s;
        }
        .plate-main { flex: 3; font-size: 34px; font-weight: bold; text-align: center; border-right: 2px solid #333; height: 100%; display: flex; align-items: center; justify-content: center;}
        .plate-region { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .region-num { font-size: 24px; font-weight: bold; }
        .region-flag { font-size: 10px; font-weight: bold; display: flex; align-items: center; }
        .flag { width: 15px; height: 10px; background: linear-gradient(to bottom, white 33%, blue 33%, blue 66%, red 66%); margin-left: 3px; border: 1px solid #ccc; }
        
        /* Спецномера */
        .plate-police { background: #0055a4; color: white; border-color: white; box-shadow: 0 0 20px rgba(0, 85, 164, 0.8); }
        .plate-police .plate-main { border-right: 2px solid white; }
        .plate-diplo { background: #d32f2f; color: white; border-color: white; box-shadow: 0 0 20px rgba(211, 47, 47, 0.8); }
        .plate-diplo .plate-main { border-right: 2px solid white; }

        .button {
            background-color: #007aff; color: white; border: none; border-radius: 14px;
            padding: 16px 32px; font-size: 18px; font-weight: bold; margin-bottom: 30px;
            cursor: pointer; width: 90%; max-width: 350px;
        }
        .button:disabled { background-color: #555; color: #888; }
        .rarity { font-size: 16px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; height: 20px; }
        .common { color: #8e8e93; } .mirror { color: #0a84ff; } .elite { color: #ff9f0a; } .special { color: #ff3b30; }
        
        .garage-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; width: 90%; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .garage-list { width: 90%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .garage-item { font-size: 16px; padding: 10px; background: #2c2c2e; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div>Гараж</div>
        <div class="balance" id="balance-text">1000 ₽</div>
    </div>

    <div class="rarity" id="rarity-label">Крути рулетку!</div>
    
    <div class="plate-container" id="plate">
        <div class="plate-main" id="plate-text">А 000 АА</div>
        <div class="plate-region">
            <div class="region-num" id="region-text">77</div>
            <div class="region-flag">RUS <div class="flag"></div></div>
        </div>
    </div>

    <button class="button" id="spin-btn" onclick="generatePlate()">Выбить номер (-100 ₽)</button>

    <div class="garage-title">Твои лучшие номера:</div>
    <div class="garage-list" id="garage-list"></div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Загрузка сохранений из памяти телефона
        let balance = parseInt(localStorage.getItem('plateBalance')) || 1000;
        let garage = JSON.parse(localStorage.getItem('plateGarage')) || [];
        
        const letters = ['А', 'В', 'Е', 'К', 'М', 'Н', 'О', 'Р', 'С', 'Т', 'У', 'Х'];
        
        function updateUI() {
            document.getElementById('balance-text').innerText = `${balance} ₽`;
            document.getElementById('spin-btn').disabled = balance < 100;
            
            const garageDiv = document.getElementById('garage-list');
            garageDiv.innerHTML = '';
            garage.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'garage-item';
                div.innerText = `${item.plate} | ${item.region} (${item.rarity})`;
                garageDiv.appendChild(div);
            });
            localStorage.setItem('plateBalance', balance);
            localStorage.setItem('plateGarage', JSON.stringify(garage));
        }

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        function generatePlate() {
            if (balance < 100) return;
            balance -= 100; // Плата за спин
            
            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }

            let l1 = getRandom(letters), l2 = getRandom(letters), l3 = getRandom(letters);
            let num = '', region = getRandomInt(1, 199);
            let rarity = 'common', rarityText = 'Обычный (+10 ₽)', reward = 10;
            let plateClass = 'plate-container';
            
            const rand = Math.random();
            
            if (rand < 0.02) {
                // 2% шанс: Спецномера (Полиция или Дипломаты)
                rarity = 'special'; rarityText = 'СПЕЦНОМЕР! (+5000 ₽)'; reward = 5000;
                if (Math.random() > 0.5) {
                    plateClass = 'plate-container plate-police'; num = getRandomInt(1000, 9999); l1 = getRandom(letters);
                    plateFull = `${l1} ${num}`;
                } else {
                    plateClass = 'plate-container plate-diplo'; num = getRandomInt(100, 999);
                    plateFull = `CD ${num} ${getRandomInt(1, 99)}`;
                }
            } else if (rand < 0.07) {
                // 5% шанс: Элитные
                rarity = 'elite'; rarityText = 'ЭЛИТНЫЙ! (+1000 ₽)'; reward = 1000;
                const eliteNums = ['001', '007', '111', '222', '333', '444', '555', '666', '777', '888', '999'];
                num = getRandom(eliteNums); l2 = l1; l3 = l1;
                plateFull = `${l1} ${num} ${l2}${l3}`;
            } else if (rand < 0.25) {
                // 18% шанс: Зеркальные
                rarity = 'mirror'; rarityText = 'Зеркальный (+250 ₽)'; reward = 250;
                let d1 = getRandomInt(0, 9), d2 = getRandomInt(0, 9);
                num = `${d1}${d2}${d1}`;
                plateFull = `${l1} ${num} ${l2}${l3}`;
            } else {
                // Обычные
                let d1 = getRandomInt(0, 9), d2 = getRandomInt(0, 9), d3 = getRandomInt(0, 9);
                num = `${d1}${d2}${d3}`;
                plateFull = `${l1} ${num} ${l2}${l3}`;
            }

            balance += reward;
            
            // Сохраняем только крутые номера в гараж (максимум 10 штук)
            if (rarity !== 'common') {
                garage.push({ plate: plateFull, region: region, rarity: rarityText.split(' ')[0] });
                if (garage.length > 10) garage.shift();
            }

            document.getElementById('plate-text').innerText = plateFull;
            document.getElementById('region-text').innerText = region;
            
            const rarityLabel = document.getElementById('rarity-label');
            rarityLabel.innerText = rarityText;
            rarityLabel.className = `rarity ${rarity}`;
            document.getElementById('plate').className = plateClass;

            updateUI();
        }

        // Запуск UI при загрузке
        updateUI();
    </script>
</body>
</html>
